<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>איפוס סיסמה - Fundog</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐾</text></svg>">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #0B3D2E 0%, #1a5a45 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .logo {
      text-align: center;
      font-size: 48px;
      margin-bottom: 12px;
    }
    h1 {
      color: #0B3D2E;
      font-size: 24px;
      font-weight: 800;
      text-align: center;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #666;
      font-size: 14px;
      text-align: center;
      margin-bottom: 28px;
    }
    label {
      display: block;
      color: #0B3D2E;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 1.5px solid #E0E0E0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      margin-bottom: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: #C9A227;
    }
    button {
      width: 100%;
      padding: 14px;
      background: #C9A227;
      color: #0B3D2E;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.2s;
      font-family: inherit;
    }
    button:hover:not(:disabled) {
      opacity: 0.9;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .message {
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      text-align: center;
    }
    .error {
      background: #FFEBEE;
      color: #C62828;
    }
    .success {
      background: #E8F5E9;
      color: #2E7D32;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
      margin-bottom: 12px;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
    .footer a {
      color: #0B3D2E;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🐾</div>
    <h1>איפוס סיסמה</h1>
    <p class="subtitle">בחר סיסמה חדשה לחשבון שלך ב-Fundog</p>

    <div id="msg"></div>

    <form id="form">
      <label for="pw">סיסמה חדשה</label>
      <input type="password" id="pw" required minlength="6" autocomplete="new-password" placeholder="לפחות 6 תווים">
      
      <label for="pw2">אימות סיסמה</label>
      <input type="password" id="pw2" required minlength="6" autocomplete="new-password" placeholder="הזן שוב את הסיסמה">
      
      <button type="submit" id="btn">עדכן סיסמה</button>
    </form>

    <div class="footer">
      <a href="index.html">חזרה לדף הבית</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://gbjuryejwjpcpgguajyf.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdianVyeWVqd2pwY3BnZ3VhanlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwODY4NTIsImV4cCI6MjA5ODY2Mjg1Mn0.V6vUTi9E-XgJz0jFQO5ILnHiix1q_VDMvHB2IA7dOeE";
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const msgEl = document.getElementById("msg");
    const form = document.getElementById("form");
    const btn = document.getElementById("btn");

    function showMessage(text, type) {
      msgEl.innerHTML = `<div class="message ${type}">${text}</div>`;
    }

    // Supabase שולח את הtoken ב-hash של ה-URL (#access_token=...)
    async function initSession() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const accessToken = params.get("access_token");
      const refreshToken = params.get("refresh_token");
      const type = params.get("type");

      if (!accessToken || type !== "recovery") {
        showMessage("קישור לא תקין או פג תוקף. בקש קישור חדש מהאפליקציה.", "error");
        form.style.display = "none";
        return;
      }

      const { error } = await client.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || "",
      });
      if (error) {
        showMessage("הקישור פג תוקף. נסה לבקש קישור חדש.", "error");
        form.style.display = "none";
      }
    }
    initSession();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;

      if (pw !== pw2) {
        showMessage("הסיסמאות לא תואמות", "error");
        return;
      }
      if (pw.length < 6) {
        showMessage("הסיסמה צריכה להכיל לפחות 6 תווים", "error");
        return;
      }

      btn.disabled = true;
      btn.textContent = "מעדכן...";
      msgEl.innerHTML = "";

      const { error } = await client.auth.updateUser({ password: pw });

      if (error) {
        showMessage("שגיאה: " + error.message, "error");
        btn.disabled = false;
        btn.textContent = "עדכן סיסמה";
      } else {
        showMessage("הסיסמה עודכנה בהצלחה! חזור לאפליקציה ובחר בסיסמה החדשה.", "success");
        form.style.display = "none";
      }
    });
  </script>
</body>
</html>
